<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arduino Live Gauge</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #111;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }
    canvas { display: block; }
    #raw-value {
      font-size: 20px;
      color: #777;
      letter-spacing: 3px;
      margin-top: 4px;
      min-width: 60px;
      text-align: center;
    }
    #status {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-top: 10px;
      font-size: 12px;
      color: #4a4a4a;
    }
    #dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #333;
      transition: background 0.5s, box-shadow 0.5s;
    }
    #dot.on {
      background: #4caf50;
      box-shadow: 0 0 7px #4caf5088;
    }
    #connect-btn {
      margin-top: 22px;
      padding: 9px 24px;
      background: #222;
      color: #aaa;
      border: 1px solid #333;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    #connect-btn:hover { background: #2a2a2a; border-color: #555; color: #ddd; }
    #connect-btn:disabled { opacity: 0.4; cursor: default; }
    #no-serial {
      display: none;
      margin-top: 18px;
      color: #a44;
      font-size: 13px;
      text-align: center;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <canvas id="gauge"></canvas>
  <div id="raw-value">—</div>
  <div id="status">
    <span id="dot"></span>
    <span id="status-text">Not connected</span>
  </div>
  <button id="connect-btn">Connect to Arduino</button>
  <div id="no-serial">Web Serial not supported.<br>Please use Chrome or Edge.</div>

  <script>
    // ── Config ────────────────────────────────────────────────────────────
    const BAUD_RATE = 9600;
    const MIN_VAL   = 0;
    const MAX_VAL   = 600;   // FSR rarely exceeds this; adjust if needed
    // ─────────────────────────────────────────────────────────────────────

    const canvas  = document.getElementById('gauge');
    const ctx     = canvas.getContext('2d');
    const rawEl   = document.getElementById('raw-value');
    const dot     = document.getElementById('dot');
    const stEl    = document.getElementById('status-text');
    const btn     = document.getElementById('connect-btn');

    // ── Layout ────────────────────────────────────────────────────────────
    const W = 560, H = 300;
    canvas.width  = W;
    canvas.height = H;
    const CX      = W / 2;
    const CY      = H - 26;
    const OUTER_R = 238;
    const INNER_R = 164;
    const MID_R   = (OUTER_R + INNER_R) / 2;
    const ARC_W   = OUTER_R - INNER_R;

    // ── Angle mapping ─────────────────────────────────────────────────────
    function valueToAngle(v) {
      const t = Math.max(0, Math.min(1, (v - MIN_VAL) / (MAX_VAL - MIN_VAL)));
      return Math.PI * (1 + t);
    }

    let dispAngle   = Math.PI;
    let targetAngle = Math.PI;

    // ── Arc gradient: red → orange → green → orange → red ────────────────
    const STOPS = [
      [0.00, [210, 28,   8]],
      [0.22, [255, 115,  0]],
      [0.50, [ 50, 210,  5]],
      [0.78, [255, 115,  0]],
      [1.00, [210, 28,   8]],
    ];

    function arcColor(t) {
      for (let i = 0; i < STOPS.length - 1; i++) {
        const [t0, c0] = STOPS[i], [t1, c1] = STOPS[i + 1];
        if (t <= t1) {
          const s = (t - t0) / (t1 - t0);
          return `rgb(${c0[0]+(c1[0]-c0[0])*s|0},${c0[1]+(c1[1]-c0[1])*s|0},${c0[2]+(c1[2]-c0[2])*s|0})`;
        }
      }
      return 'rgb(210,28,8)';
    }

    // ── Draw ──────────────────────────────────────────────────────────────
    const SEG = 300;

    function draw() {
      ctx.clearRect(0, 0, W, H);

      // Gradient arc
      ctx.lineCap = 'butt';
      for (let i = 0; i < SEG; i++) {
        const t0 = i / SEG, t1 = (i + 1) / SEG;
        const a0 = Math.PI + t0 * Math.PI;
        const a1 = Math.PI + t1 * Math.PI;
        ctx.beginPath();
        ctx.arc(CX, CY, MID_R, a0, a1, false);
        ctx.strokeStyle = arcColor(t0 + 0.5 / SEG);
        ctx.lineWidth   = ARC_W + 1;
        ctx.stroke();
      }

      // Labels
      ctx.font         = '15px -apple-system, sans-serif';
      ctx.fillStyle    = '#ccc';
      ctx.textBaseline = 'middle';
      ctx.textAlign    = 'left';
      ctx.fillText('No pressure', 18, CY + 4);
      ctx.textAlign = 'right';
      ctx.fillText('Hard pressure', W - 18, CY + 4);

      // Needle
      const nx = CX + MID_R * 0.9 * Math.cos(dispAngle);
      const ny = CY + MID_R * 0.9 * Math.sin(dispAngle);
      ctx.beginPath();
      ctx.moveTo(CX, CY);
      ctx.lineTo(nx, ny);
      ctx.strokeStyle = 'rgba(190, 205, 255, 0.92)';
      ctx.lineWidth   = 2;
      ctx.lineCap     = 'round';
      ctx.stroke();

      // Pivot dot
      ctx.beginPath();
      ctx.arc(CX, CY, 6, 0, Math.PI * 2);
      ctx.fillStyle = '#fff';
      ctx.fill();
    }

    // ── Animation loop ─────────────────────────────────────────────────────
    (function loop() {
      dispAngle += (targetAngle - dispAngle) * 0.1;
      draw();
      requestAnimationFrame(loop);
    })();

    // ── Web Serial ─────────────────────────────────────────────────────────
    if (!('serial' in navigator)) {
      btn.style.display = 'none';
      document.getElementById('no-serial').style.display = 'block';
    }

    btn.addEventListener('click', async () => {
      try {
        const port = await navigator.serial.requestPort();
        await port.open({ baudRate: BAUD_RATE });

        btn.disabled     = true;
        btn.textContent  = 'Connected';
        dot.className    = 'on';
        stEl.textContent = 'Live';

        const decoder  = port.readable.pipeThrough(new TextDecoderStream());
        const reader   = decoder.getReader();
        let   buffer   = '';

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += value;
          const lines = buffer.split('\n');
          buffer = lines.pop();
          for (const line of lines) {
            // Parses: "FSR Value: 512 -> MEDIUM PRESSURE"
            const match = line.match(/FSR Value:\s*(\d+)/);
            if (match) {
              const num = parseInt(match[1], 10);
              targetAngle       = valueToAngle(num);
              rawEl.textContent = num;
              // Show pressure category from the label after "->"
              const label = line.split('->')[1];
              if (label) stEl.textContent = label.trim();
            }
          }
        }
      } catch (err) {
        if (err.name !== 'NotFoundError') {
          stEl.textContent = 'Error: ' + err.message;
          dot.className    = '';
          btn.disabled     = false;
          btn.textContent  = 'Connect to Arduino';
        }
      }
    });
  </script>
</body>
</html>
